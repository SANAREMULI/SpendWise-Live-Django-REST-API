<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpendWise Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="intro">
      <p class="eyebrow">SpendWise Live</p>
      <h1>Your spending, in focus.</h1>
      <p class="lede">A small, private expense ledger connected to the Django API.</p>
    </section>

    <section id="login-panel" class="panel">
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Username <input id="username" required autocomplete="username"></label>
        <label>Password <input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-status" class="status" role="status"></p>
    </section>

    <section id="app-panel" class="hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Live ledger</p>
          <h2>Recent expenses</h2>
        </div>
        <button id="logout" class="secondary" type="button">Sign out</button>
      </div>

      <form id="expense-form" class="panel add-form">
        <h2>Add an expense</h2>
        <div class="form-grid">
          <label>Amount <input id="amount" type="number" min="0.01" step="0.01" required></label>
          <label>Category <input id="category" required maxlength="100"></label>
          <label class="wide">Description <input id="description" required maxlength="255"></label>
        </div>
        <button type="submit">Add expense</button>
        <p id="expense-status" class="status" role="status"></p>
      </form>

      <div class="filters">
        <input id="search" placeholder="Search descriptions" aria-label="Search descriptions">
        <div class="category-buttons" aria-label="Filter by category">
          <button class="chip active" data-category="" type="button">All</button>
          <button class="chip" data-category="food" type="button">Food</button>
          <button class="chip" data-category="transport" type="button">Transport</button>
          <button class="chip" data-category="bills" type="button">Bills</button>
        </div>
      </div>
      <div id="expense-list" class="expense-list"></div>
      <div class="pagination">
        <button id="previous" class="secondary" type="button" disabled>Previous</button>
        <span id="page-label">Page 1</span>
        <button id="next" class="secondary" type="button" disabled>Next</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
